apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-k8s-ai-dashboard-frontend
  labels:
    app.kubernetes.io/name: hello-k8s-ai-dashboard-frontend
    app.kubernetes.io/component: dashboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-k8s-ai-dashboard-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-k8s-ai-dashboard-frontend
        app.kubernetes.io/component: dashboard-frontend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: hello-k8s-ai-dashboard-frontend:dev
        # :dev 标签可变，Always 让每次部署都重新解析镜像 digest，避免 kubelet 缓存旧镜像。
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: nginx-runtime
          mountPath: /var/cache/nginx
        - name: nginx-pid
          mountPath: /tmp
      volumes:
      - name: nginx-runtime
        emptyDir: {}
      - name: nginx-pid
        emptyDir: {}
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hello-k8s-ai-dashboard-frontend
  labels:
    app.kubernetes.io/name: hello-k8s-ai-dashboard-frontend
spec:
  selector:
    app.kubernetes.io/name: hello-k8s-ai-dashboard-frontend
  ports:
  - name: http
    port: 80
    targetPort: http
