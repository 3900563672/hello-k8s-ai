apiVersion: v1
kind: Service
metadata:
  name: hello-k8s-ai-dashboard-postgresql
  labels:
    app.kubernetes.io/name: hello-k8s-ai-dashboard-postgresql
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: hello-k8s-ai-dashboard-postgresql
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hello-k8s-ai-dashboard-postgresql
  labels:
    app.kubernetes.io/name: hello-k8s-ai-dashboard-postgresql
    app.kubernetes.io/component: database
spec:
  serviceName: hello-k8s-ai-dashboard-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-k8s-ai-dashboard-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-k8s-ai-dashboard-postgresql
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # postgres:alpine 中 postgres 账户的 uid/gid 为 70。
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgresql
        image: postgres:17-alpine
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: hello-k8s-ai-dashboard-postgresql
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgresql
          containerPort: 5432
        readinessProbe:
          exec:
            command: [pg_isready, -U, dashboard, -d, dashboard]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          exec:
            command: [pg_isready, -U, dashboard, -d, dashboard]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: runtime
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: runtime
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: standard
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 10Gi
