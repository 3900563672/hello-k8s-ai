# 源码路径 → 必须同 PR 更新的文档（make docs-check 的 MAP 门禁数据源）
# 规则：
# - 目录前缀（以 / 结尾）匹配该目录下全部文件；单文件键精确匹配。
# - 命中多项映射时取最长匹配；命中后其映射文档必须出现在同一 PR/提交中。
# - 生成物目录（config/crd/bases/、config/rbac/role.yaml、zz_generated）不单独映射，
#   其源（api/v1/、internal/controller/）已映射；docs/、change-history/ 自身变化不触发。
# - 新增文档必须在此登记；人类文档反向所有权表由 make docs-sync 渲染。
