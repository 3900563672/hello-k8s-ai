# 开发/演示底座：Kind 多节点集群（节点收敛 5 = 1 control-plane + 4 worker）
# 持久化：PVC 数据落在节点容器 /var named volume（Docker 数据盘 vhdx，WSL/Docker 重启不丢）。
#         不使用宿主 hostPath：Docker Desktop 下它位于 VM 根文件系统（重置即清空），
#         bind 失效还会 fallback 成 tmpfs 覆盖 PVC 目录（见 docs/lessons/kind-hostpath-docker-desktop-rootfs.md）。
# 注意：删除集群重建后旧数据不会自动挂回，需按 hack/kind/backup-data.sh + restore-data.sh 显式恢复。
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: hello-k8s-ai-dev
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
  - role: worker
