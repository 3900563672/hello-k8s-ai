name: 文档检查

on: [push, pull_request]

permissions:
  contents: read

jobs:
  docs:
    name: 文档链接与同步检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 文档一致性（链接 / 白名单 / MAP 门禁 / 时间戳）
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export DOCS_CHECK_BASE="origin/${{ github.base_ref }}"
          fi
          make docs-check

      - name: 生成物一致性（docs-sync 后无差异）
        run: make docs-sync-check
