name: 代码检查

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'change-history/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'change-history/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Ubuntu 代码检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 恢复 golangci-lint 缓存（含自定义插件编译产物）
        id: cache-gcl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            bin
            ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('.custom-gcl.yml') }}-v2.12.2

      - name: 刷新 bin 缓存 mtime（命中时让 make 跳过重编译）
        if: steps.cache-gcl.outputs.cache-hit == 'true'
        run: |
          touch bin/golangci-lint bin/golangci-lint-v2.12.2
          test -x bin/golangci-lint || { echo "缓存缺少可执行文件，将重新编译"; exit 0; }

      - name: 安装固定版本 golangci-lint（预编译 + 编译自定义插件）
        if: steps.cache-gcl.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz" | tar -xz -C /tmp
          cp /tmp/golangci-lint-2.12.2-linux-amd64/golangci-lint "bin/golangci-lint-v2.12.2"
          ln -sf "$(pwd)/bin/golangci-lint-v2.12.2" bin/golangci-lint
          bin/golangci-lint version
          bin/golangci-lint custom --destination bin --name golangci-lint-custom
          mv -f bin/golangci-lint-custom bin/golangci-lint
          bin/golangci-lint version

      - name: 安装脚本/文档静态检查工具
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          npm install -g markdownlint-cli2

      - name: 校验 lint 配置
        run: make lint-config
      - name: 执行 lint
        run: make lint
