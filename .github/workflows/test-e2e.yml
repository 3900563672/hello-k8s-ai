name: E2E 测试

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'change-history/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'change-history/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Ubuntu E2E 测试
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_KIND_CLUSTER: hello-k8s-ai-test-e2e
      KIND_NODE_IMAGE: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
      DOCKER_BUILD_CACHE: --cache-from=type=gha --cache-to=type=gha,mode=max
    steps:
      - name: 检出代码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 配置 Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: 安装固定版本 Kind（预编译二进制，避免每次 go install 编译）
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSLo "$HOME/.local/bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64"
          chmod +x "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 验证 Kind 安装
        run: kind version

      - name: 初始化 BuildKit 缓存
        run: |
          # 失败不阻断（回退无缓存构建），但保留输出便于诊断
          docker buildx create --use --name ci-builder || true

      - name: 检查依赖并执行 E2E
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          make test-e2e

      - name: 清理 E2E 集群
        if: always()
        run: make cleanup-test-e2e || true
