name: Bug 报告
description: "提交问题或异常行为，标题使用 `bug: ` 前缀。"
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告。请提供可复现信息，帮助快速定位问题。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么，与预期行为的差异。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从部署到复现的完整步骤或命令。
      placeholder: |
        1. 执行 ...
        2. 观察 ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: Kubernetes Context、镜像版本、浏览器等。
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: 日志与诊断
      description: Controller / Simulator / Backend 日志、`.runtime/last-failure.log`、`kubectl describe` 输出等。
    validations:
      required: false
