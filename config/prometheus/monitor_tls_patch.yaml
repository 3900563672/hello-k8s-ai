# 使用 cert-manager 管理的证书，为 Prometheus ServiceMonitor 启用安全 TLS 配置。
- op: replace
  path: /spec/endpoints/0/tlsConfig
  value:
    # Kustomize 会替换 SERVICE_NAME 与 SERVICE_NAMESPACE。
    serverName: SERVICE_NAME.SERVICE_NAMESPACE.svc
    insecureSkipVerify: false
    ca:
      secret:
        name: metrics-server-cert
        key: ca.crt
    cert:
      secret:
        name: metrics-server-cert
        key: tls.crt
    keySecret:
      name: metrics-server-cert
      key: tls.key
