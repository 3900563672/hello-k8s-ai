# 为全部资源设置 Namespace。
namespace: hello-k8s-ai-system

# 该字段会添加到全部资源名称前，并应与上方 Namespace 的前缀（连字符前的部分）一致。
namePrefix: hello-k8s-ai-

# 添加到全部资源及 Selector 的 Label。
#labels:
#- includeSelectors: true
#  pairs:
#    someName: someValue

resources:
- ../crd
- ../rbac
- ../manager
# [WEBHOOK] 启用 Webhook 时，解除所有带 [WEBHOOK] 前缀部分的注释，
# 包括 crd/kustomization.yaml 中的对应配置。
#- ../webhook
# [CERTMANAGER] 启用 cert-manager 时，解除全部 [CERTMANAGER] 配置的注释；同时必须启用 [WEBHOOK]。
#- ../certmanager
# [PROMETHEUS] 启用 Prometheus Monitor 时，解除全部 [PROMETHEUS] 配置的注释。
#- ../prometheus
# [METRICS] 暴露 Controller Manager Metrics Service。
- metrics_service.yaml
# [NETWORK POLICY] 使用 NetworkPolicy 保护 /metrics 端点与 Webhook Server。
# 只有位于带 metrics: enabled Label 的 Namespace 中的 Pod 才能采集 Metrics。
# 只有位于带 webhooks: enabled Label 的 Namespace 中的 CR 才能访问 Webhook Server。
#- ../network-policy

# 启用 Metrics 时解除 patches 的注释。
patches:
# [METRICS] 下列 patch 通过 :8443 端口和 HTTPS 启用 Metrics 端点。
# 参考：https://book.kubebuilder.io/reference/metrics
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment

# 同时启用 Metrics 与 cert-manager 时，解除 patches 的注释。
# [METRICS-WITH-CERTS] 下列 patch 使用 cert-manager 自签名证书保护 Metrics。
#- path: cert_metrics_manager_patch.yaml
#  target:
#    kind: Deployment

# [WEBHOOK] 启用 Webhook 时，解除所有带 [WEBHOOK] 前缀部分的注释，
# 包括 crd/kustomization.yaml 中的对应配置。
#- path: manager_webhook_patch.yaml
#  target:
#    kind: Deployment

