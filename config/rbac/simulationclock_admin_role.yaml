# hello-k8s-ai 自身不使用此辅助角色。
# 该角色授予 SimulationClock 的完整管理权限，供集群管理员按需绑定。

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hello-k8s-ai
    app.kubernetes.io/managed-by: kustomize
  name: simulationclock-admin-role
rules:
- apiGroups:
  - platform.study.com
  resources:
  - simulationclocks
  verbs:
  - '*'
- apiGroups:
  - platform.study.com
  resources:
  - simulationclocks/status
  verbs:
  - get
