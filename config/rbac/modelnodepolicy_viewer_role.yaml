# hello-k8s-ai 自身不使用此辅助角色。
# 该角色授予对应 platform.study.com 资源的只读权限。

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hello-k8s-ai
    app.kubernetes.io/managed-by: kustomize
  name: modelnodepolicy-viewer-role
rules:
- apiGroups:
  - platform.study.com
  resources:
  - modelnodepolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.study.com
  resources:
  - modelnodepolicies/status
  verbs:
  - get
