---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: orchestrators.platform.study.com
spec:
  group: platform.study.com
  names:
    kind: Orchestrator
    listKind: OrchestratorList
    plural: orchestrators
    singular: orchestrator
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantRef.name
      name: Tenant
      type: string
    - jsonPath: .spec.scaleUpCooldownSeconds
      name: ScaleUpCooldown
      type: integer
    - jsonPath: .spec.scaleDownCooldownSeconds
      name: ScaleDownCooldown
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Orchestrator 是租户级的编排配置，控制决策器的冷却和副本范围策略。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OrchestratorSpec 每个租户的扩缩容配置
            properties:
              allowScaleToZero:
                description: 允许缩到 0 吗？只在没流量时有用
                type: boolean
              maxReplicas:
                description: 租户所有实例的最大副本数，必填；0 表示不限制（模拟器无网关，接受任意 QPS，扩到容量上限为止）
                minimum: 0
                type: integer
              maxScaleUpBatch:
                default: 10
                description: |-
                  单次扩容决策最多补的副本数；0 表示默认 10。
                  模拟器无网关，副本可无限增长；批量扩容配合冷却形成批次节奏，
                  既避免大并发下“10→100 要等 90 次冷却”，也防止单次决策把副本数冲过头。
                minimum: 0
                type: integer
              minReplicas:
                default: 1
                description: 租户所有实例的最小副本数（无流量且允许缩到 0 时可被覆盖）
                minimum: 0
                type: integer
              scaleDownCooldownSeconds:
                default: 120
                description: 缩容冷却时间，单位秒，默认 120
                minimum: 0
                type: integer
              scaleUpCooldownSeconds:
                default: 60
                description: 扩容后多长时间内不再扩容，单位秒，默认 60
                minimum: 0
                type: integer
              tenantRef:
                description: 属于哪个租户
                properties:
                  name:
                    description: 被引用对象的名称
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - maxReplicas
            - tenantRef
            type: object
            x-kubernetes-validations:
            - message: minReplicas must not exceed maxReplicas unless maxReplicas
                is 0 (unlimited)
              rule: self.maxReplicas == 0 || self.minReplicas <= self.maxReplicas
          status:
            description: OrchestratorStatus 记录最近一次扩缩操作和标准 Conditions。
            properties:
              conditions:
                description: 标准 K8s conditions
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastScaleDownTime:
                description: 最近一次缩容时间；与扩容时间独立，避免两个方向共用冷却窗口
                format: date-time
                type: string
              lastScaleUpTime:
                description: 最近一次扩容时间；与缩容时间独立，避免两个方向共用冷却窗口
                format: date-time
                type: string
              lastScaling:
                description: 最近一次扩缩详情；尚未发生扩缩时为空
                properties:
                  action:
                    description: 操作：ScaleUp 或 ScaleDown
                    enum:
                    - ScaleUp
                    - ScaleDown
                    type: string
                  instanceName:
                    description: 被操作的实例
                    type: string
                  newReplicas:
                    description: 操作后副本数
                    type: integer
                  oldReplicas:
                    description: 操作前副本数
                    type: integer
                  time:
                    description: 时间
                    format: date-time
                    type: string
                required:
                - action
                - instanceName
                - newReplicas
                - oldReplicas
                - time
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
