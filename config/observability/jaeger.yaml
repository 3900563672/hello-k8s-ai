apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-k8s-ai-jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: tracing-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/component: tracing-backend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: jaeger
        image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: query
          containerPort: 16686
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: metrics
          containerPort: 8888
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          tcpSocket:
            port: query
          initialDelaySeconds: 8
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: query
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: hello-k8s-ai-jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
  - name: query
    port: 16686
    targetPort: query
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
  - name: metrics
    port: 8888
    targetPort: metrics
