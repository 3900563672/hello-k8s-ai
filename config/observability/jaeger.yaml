apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-k8s-ai-jaeger-config
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: tracing-backend
data:
  config.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        resource:
          service.name: jaeger
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
        logs:
          level: info

    extensions:
      healthcheckv2:
        use_v2: true
        http:
      jaeger_query:
        storage:
          traces: some_store
      jaeger_storage:
        backends:
          some_store:
            badger:
              directories:
                keys: "/tmp/jaeger/"
                values: "/tmp/jaeger/"
              ephemeral: false
              # 7 天，与 Prometheus retention 对齐，保证历史回放窗口一致。
              ttl:
                spans: 168h
              metrics_update_interval: 10s

    receivers:
      otlp:
        protocols:
          # 显式 0.0.0.0：不写 endpoint 时 Jaeger v2 默认只绑 127.0.0.1，
          # otel-collector 从 Pod 网络无法连接。
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s

    exporters:
      jaeger_storage_exporter:
        trace_storage: some_store
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hello-k8s-ai-jaeger-data
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: tracing-backend
spec:
  storageClassName: standard
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-k8s-ai-jaeger
  annotations:
    # badger 单副本 + RWO PVC：滚动更新会新旧 Pod 抢目录锁导致 CrashLoop，
    # 重启/升级必须先 scale 到 0 再扩回 1（见 docs/agents/KNOWN_PITFALLS.md）。
    platform.study.com/restart-procedure: scale-to-zero
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: tracing-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/component: tracing-backend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # 官方镜像默认 UID 10001、GID 0；fsGroup 0 使 local-path PVC 对容器组可写。
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: jaeger
        image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
        imagePullPolicy: IfNotPresent
        args:
        - --config=/etc/jaeger/config.yaml
        ports:
        - name: query
          containerPort: 16686
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: metrics
          containerPort: 8888
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        env:
        # badger 默认 BlockCacheSize 256MB + MemTable 64MB（v2.20.0 不暴露 cache 配置，
        # 见 jaeger 源码 internal/storage/v1/badger/options.go），512Mi 上限在 100+ 模拟器
        # Pod 流量下必 OOM。1Gi 上限 + 768Mi Go GC 软限（cache 在 Go 堆内）双保险。
        - name: GOMEMLIMIT
          value: "805306368"  # 768Mi 的字节数：Go GOMEMLIMIT 不接受 Mi 后缀
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          tcpSocket:
            port: query
          initialDelaySeconds: 8
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: query
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/jaeger
          readOnly: true
        - name: data
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: hello-k8s-ai-jaeger-config
      - name: data
        persistentVolumeClaim:
          claimName: hello-k8s-ai-jaeger-data
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: hello-k8s-ai-jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
  - name: query
    port: 16686
    targetPort: query
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
  - name: metrics
    port: 8888
    targetPort: metrics